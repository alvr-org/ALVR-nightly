name: Release nightly

env:
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  schedule:
    - cron: "45 23 * * *"

jobs:
  prepare_release:
    runs-on: windows-2022
    outputs:
      release_ref: ${{ steps.gen_tag.outputs.release_ref }}
      version_tag: ${{ steps.gen_tag.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: main

      - name: Generate tag, set release ref
        id: gen_tag
        env:
          RUST_BACKTRACE: 1
        run: |
          $out = cargo xtask bump --nightly
          echo $out
          echo "version_tag=$(echo $out | sls -CaseSensitive -Pattern '^v.*$')" >> $env:GITHUB_OUTPUT
          echo "release_ref=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

  build_windows_streamer:
    # Windows latest has Rust, Android NDK and LLVM already installed.
    # https://github.com/actions/virtual-environments/blob/main/images/win/Windows2019-Readme.md
    runs-on: windows-2022
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - name: Build and package ALVR
        id: build
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo xtask bump --nightly
          cargo xtask package-streamer --gpl --ci
          $file = Get-ChildItem -Name .\build\*.exe | Select-Object -f 1
          echo "::set-output name=exe_filename::$file"

      # Upload artifacts
      # - name: Upload installer (exe)
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ needs.prepare_release.outputs.upload_url }}
      #     asset_path: ./build/${{ steps.build.outputs.exe_filename }}
      #     asset_name: ${{ steps.build.outputs.exe_filename }}
      #     asset_content_type: application/octet-stream
      # - name: Upload installer (msi)
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ needs.prepare_release.outputs.upload_url }}
      #     asset_path: ./build/alvr_streamer_windows.msi
      #     asset_name: alvr_streamer_windows.msi
      #     asset_content_type: application/octet-stream
      - name: Upload portable streamer (zip)
        uses: actions/upload-artifact@v7
        with:
          name: windows-streamer
          path: ./build/alvr_streamer_windows.zip

  build_windows_streamer_debug:
    runs-on: windows-2022
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo xtask prepare-deps --platform windows --gpl --ci
          cargo xtask bump --nightly
          cargo xtask build-streamer --gpl
          cd build
          zip -r9X alvr_streamer_windows_debug .

      - name: Upload portable streamer (zip)
        uses: actions/upload-artifact@v7
        with:
          name: windows-streamer-debug
          path: ./build/alvr_streamer_windows_debug.zip

  build_windows_launcher:
    runs-on: windows-2022
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo xtask bump --nightly
          cargo xtask package-launcher --ci

      - name: Upload portable launcher (zip)
        uses: actions/upload-artifact@v7
        with:
          name: windows-launcher
          path: ./build/alvr_launcher_windows.zip

  build_linux_streamer:
    runs-on: ubuntu-22.04
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - name: Build dependencies and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 25088A0359807596
          echo "deb http://ppa.launchpad.net/pipewire-debian/pipewire-upstream/ubuntu $(lsb_release -cs) main" | sudo tee -a /etc/apt/sources.list.d/pipewire-upstream.list
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install libfuse2 build-essential pkg-config nasm libva-dev libdrm-dev libvulkan-dev libx264-dev libx265-dev cmake libasound2-dev libjack-jackd2-dev libxrandr-dev libunwind-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev
          cargo xtask bump --nightly
          cargo xtask package-streamer --gpl --ci

      - name: Upload linux streamer
        uses: actions/upload-artifact@v7
        with:
          name: linux-streamer
          path: ./build/alvr_streamer_linux.tar.gz

  build_linux_streamer_debug:
    runs-on: ubuntu-22.04
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - name: Build dependencies and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 25088A0359807596
          echo "deb http://ppa.launchpad.net/pipewire-debian/pipewire-upstream/ubuntu $(lsb_release -cs) main" | sudo tee -a /etc/apt/sources.list.d/pipewire-upstream.list
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install libfuse2 build-essential pkg-config nasm libva-dev libdrm-dev libvulkan-dev libx264-dev libx265-dev cmake libasound2-dev libjack-jackd2-dev libxrandr-dev libunwind-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev
          cargo xtask prepare-deps --platform linux --gpl
          cargo xtask bump --nightly
          cargo xtask build-streamer --gpl
          tar -czvf ./build/alvr_streamer_linux_debug.tar.gz -C ./build alvr_streamer_linux

      - name: Upload linux streamer
        uses: actions/upload-artifact@v7
        with:
          name: linux-streamer-debug
          path: ./build/alvr_streamer_linux_debug.tar.gz

  build_linux_launcher:
    runs-on: ubuntu-22.04
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - name: Install dependencies and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libgtk-3-dev
          cargo xtask bump --nightly
          cargo xtask package-launcher --ci

      - name: Upload linux launcher
        uses: actions/upload-artifact@v7
        with:
          name: linux-launcher
          path: ./build/alvr_launcher_linux.tar.gz

  build_flatpak_bundle:
    runs-on: ubuntu-latest
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - name: Build and install dependencies
        env:
          RUST_BACKTRACE: 1
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build and package ALVR flatpak (.flatpak)
        id: build_flatpak
        run: |
          sudo flatpak-builder --repo=.flatpak-repo --install-deps-from=flathub --force-clean --disable-rofiles-fuse --default-branch=stable --arch=x86_64 .flatpak-build-dir alvr/xtask/flatpak/com.valvesoftware.Steam.Utility.alvr.json
          flatpak build-bundle .flatpak-repo com.valvesoftware.Steam.Utility.alvr.flatpak com.valvesoftware.Steam.Utility.alvr stable --runtime
      - name: Upload flatpak streamer for Linux
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: com.valvesoftware.Steam.Utility.alvr.flatpak

  build_android_client:
    runs-on: ubuntu-latest
    needs: [prepare_release]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "alvr-org/ALVR"
          ref: ${{ needs.prepare_release.outputs.release_ref }}
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32"
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo xtask bump --nightly
          cargo xtask package-client --ci
          cargo xtask package-client-lib

      - name: Sign apk
        uses: ilharp/sign-android-release@v2
        id: sign_apk
        with:
          releaseDir: build/alvr_client_android
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - run: cp "${{ steps.sign_apk.outputs.signedFile }}" ./build/alvr_client_android.apk

      - name: Upload apk and client library
        uses: actions/upload-artifact@v7
        with:
          name: android-client
          path: |
            ./build/alvr_client_android.apk
            ./build/alvr_client_core.zip

  publish_release:
    runs-on: ubuntu-latest
    needs:
      [
        prepare_release,
        build_windows_streamer,
        build_windows_streamer_debug,
        build_windows_launcher,
        build_linux_streamer,
        build_linux_streamer_debug,
        build_linux_launcher,
        build_flatpak_bundle,
        build_android_client,
      ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Release tag is taken from the gen_tag job.
          tag_name: ${{ needs.prepare_release.outputs.version_tag }}
          name: ALVR ${{ needs.prepare_release.outputs.version_tag }}
          # TODO: gather commit messages to post here in the body
          body: |
            Nightly release of ALVR: ${{ needs.prepare_release.outputs.version_tag }}
            Generated from commit: alvr-org/ALVR@${{ needs.prepare_release.outputs.release_ref }}
          draft: false
          prerelease: false
          files: artifacts/*
